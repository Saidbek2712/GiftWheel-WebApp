<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Wheel</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .wheel {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .ton {
      font-size: 32px;
      font-weight: bold;
      color: #00aaff;
    }

    button {
      margin-top: 40px;
      background-color: #00aaff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0088cc;
    }
  </style>
</head>
<body>
  <div class="wheel">
    <div class="ton">TON</div>
  </div>
  <button onclick="spin()">🎡 Spin the Wheel</button>

  <script>
    function spin() {
      alert("Wheel spinning... (functionality coming soon!)");
    }
  </script>
</body>
</html>
