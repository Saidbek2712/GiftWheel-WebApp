<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Wheel - Daily Bonus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="profile-icon">👤</div>

    <div class="wheel-area">
      <canvas id="wheel" width="320" height="320"></canvas>

      <!-- pointer: маленький треугольник прямо над кнопкой, указывает вверх -->
      <div class="pointer"></div>
    </div>

    <button id="spin">Try Your Luck</button>

    <div id="result" class="result"></div>

    <div class="nav-bar">
      <button>Cases</button>
      <button class="active">Daily Bonus</button>
      <button>Wheel</button>
      <button>Gifts</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
